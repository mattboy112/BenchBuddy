[platformio]
default_envs = bench

[env:bench]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; N16R8 memory layout
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

lib_deps =
    ESP32Async/AsyncTCP@^3.5.0
    ESP32Async/ESPAsyncWebServer@^3.12.1
    bblanchon/ArduinoJson@^7.4.3

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -DWS_MAX_QUEUED_MESSAGES=24
    -Wall
    -Wextra
    -Wno-unused-parameter

; Packs web/ (page + fonts) into src/web_assets.h before every build
extra_scripts = pre:scripts/embed_web.py
